name: Docker Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROS1 Noetic image
        run: docker compose build slam

      - name: Test image
        run: |
          docker run --rm ros1_horizon-ros1_noetic:latest bash -c "
            source /opt/ros/noetic/setup.bash
            rosversion -d
          "

      - name: Lint shell scripts
        run: |
          sudo apt install -y shellcheck
          shellcheck slam.sh run_horizon_ros1.sh rviz_horizon.sh scripts/*.sh || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check INSTALL exists
        run: test -f INSTALL.md
